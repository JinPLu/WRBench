name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and test
        run: |
          python -m pip install -U pip setuptools wheel
          pip install -e ".[dev]"
          python -m pytest -q
          python -c "import wrbench; from wrbench.eval.runtime import contract_path; print(contract_path())"

  oss-verify:
    name: OSS release gate (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run the canonical OSS release gate
        run: bash scripts/oss_verify.sh
